<svg xmlns="http://www.w3.org/2000/svg" width="680" height="529" viewBox="0 0 680 529" role="img" aria-labelledby="title description">
  <title id="title">Research at a glance</title>
  <desc id="description">Research questions about how industrial robots affect international trade, global value chains, and industrial structure. Foreign direct investment is another research focus, and text mining is a research method. Current work studies how industrial robots affect export performance, export quality, and industrial upgrading.</desc>
