    .label { fill: #302328; font-size: 19px; font-weight: 650; }
    .hub { fill: #fff; font-size: 21px; font-weight: 700; }
    .sub { fill: #65565b; font-size: 15px; }
    .card { fill: #fff; stroke: #e7d6dc; }
    .arrow { fill: none; stroke: #8e3a50; stroke-width: 1.7; marker-end: url(#arrow); }
  </style>
